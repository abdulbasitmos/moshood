<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>.car-gallery {
  text-align: center;
  background-color: #f4f4f4;
  padding: 20px;
}

.car-box {
  display: inline-block;
  margin: 10px;
  border: 2px solid #ccc;
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.car-box:hover {
  transform: scale(1.05);
  border-color: #000;
}

.car-box img {
  width: 200px;
  height: 120px;
  object-fit: cover;
  display: block;
}
</style>
<body>
    Stress-free, trustworthy, no hidden costs

</body>
</html>
