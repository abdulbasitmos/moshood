<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Rental</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f4;
    }

    /* Header Section */
    header {
      background: url('https://images.unsplash.com/photo-1605559424843-3f9b6c7d3c3f') no-repeat center center/cover;
      height: 400px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    header h1 {
      font-size: 48px;0
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .footer-column {
      flex: 1;
      min-width: 250px;
      margin-bottom: 20px;
    }

    .footer-column h3 {
      margin-bottom: 15px;
      color: #fff;
    }

    .footer-column ul {
      list-style: none;
      padding: 0;
    }

    .footer-column ul li {
      margin-bottom: 10px;
    }

    .footer-column ul li a {
      color: #ccc;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-column ul li a:hover {
      color: #fff;
    }

    .social-icons a {
      margin-right: 10px;
      display: inline-block;
    }

    .social-icons img {
      width: 30px;
      height: 30px;
      filter: brightness(0) invert(1);
      transition: transform 0.3s;
    }

    .social-icons img:hover {
      transform: scale(1.1);
    }

    .footer-bottom {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>



  <!-- Footer Section -->
  <footer>
    <div class="footer-container">
      <div class="footer-column">
        <h3>CarRentalPro</h3>
        <p>Drive in style, wherever you go.</p>
        <div class="social-icons">
          <a href="https://facebook.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
          </a>
          <a href="https://instagram.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
          </a>
          <a href="https://twitter.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/en/6/60/Twitter_Logo_as_of_2021.svg" alt="Twitter">
          </a>
        </div>
      </div>

      <div class="footer-column">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="/about">About Us</a></li>
          <li><a href="/cars">Available Cars</a></li>
          <li><a href="/pricing">Pricing</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </div>

      <div class="footer-column">
        <h3>Contact</h3>
        <p>Email: support@carrentalpro.com</p>
        <p>Phone: +234 800 123 4567</p>
        <p>Location: Port Harcourt, Nigeria</p>
      </div>
    </div>

    <div class="footer-bottom">
      &copy; 2025 CarRentalPro. All rights reserved.
    </div>
  </footer>

</body>
</html>
